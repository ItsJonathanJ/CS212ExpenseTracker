<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense History</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../node_modules/jquery/dist/jquery.min.js" defer></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="index.js" type="module"></script>
</head>
<body>
    <main class="container pb-5">
        <h1 class="my-4">Expense History</h1>

        <section class="mb-5" aria-labelledby="current-heading">
            <h2 id="current-heading" class="h4 mb-3">Logged expenses</h2>
            <div id="expense-history-list" class="list-group">
                <!-- Expense cards are added dynamically -->
            </div>
        </section>

        <section aria-labelledby="activity-heading">
            <h2 id="activity-heading" class="h4 mb-3">Activity log</h2>
            <p class="text-body-secondary small">Every expense that was created, edited or deleted, newest first.</p>
            <ul id="activity-log" class="list-group">
                <!-- Activity entries are added dynamically -->
            </ul>
        </section>
    </main>
</body>
</html>
