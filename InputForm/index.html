<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Record and track your everyday expenses.">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../node_modules/jquery/dist/jquery.min.js" defer></script>
  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="index.js" type="module"></script>
</head>
<body>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a href="../Dashboard/">Spending Summary</a>
      <a href="../ExpenseHistory/">Expense History</a>
      <button type="button" id="logout-button" class="btn btn-outline-secondary btn-sm">Log Out</button>
    </div>
    <section class="form-group card card-body mb-4">
      <h2>Add New Expense</h2>
      <form id="expense-form">
        <div class="form-field">
          <label for="description">Description:</label>
          <input type="text" id="description" name="description" required>
        </div>
        <div class="form-field">
          <label for="amount">Amount:</label>
          <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
        </div>
        <div class="form-field">
          <label for="date">Date:</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="form-field">
          <label for="category">Category:</label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="food">Food</option>
            <option value="transportation">Transportation</option>
            <option value="entertainment">Entertainment</option>
            <option value="utilities">Utilities</option>
            <option value="other">Other</option>
          </select>
        </div>
        <button type="submit" id="add-expense-btn" class="btn btn-success">Add Expense</button>
      </form>
    </section>

    <section id="expense-summary" class="form-group card card-body mb-4">
      <h2>Expense Summary</h2>
      <div class="summary-item">
        <span>Total Expenses:</span>
        <span id="total-expenses" class="fw-bold"></span>
      </div>
    </section>

<!-- TOTAL -->
    <h3>Expense List</h3>
    <section id="expense-list">
      <article class="expense-card card shadow-sm mb-3" data-category="food">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start gap-3">
            <div>
              <h4 class="expense-title h5 mb-2">Weekly groceries</h4>
              <span class="badge rounded-pill text-bg-success">Food</span>
            </div>
            <span class="expense-amount fs-5 fw-bold text-nowrap">$54.75</span>
          </div>
          <div class="d-flex justify-content-between align-items-center gap-3 mt-3 pt-3 border-top">
          <time class="small text-body-secondary" datetime="2026-11-14">
            November 14, 2026
          </time>
          <button type="button" class="edit-expense-btn btn btn-outline-secondary btn-sm">Edit</button>
          </div>
        </div>
      </article>
    </section>

   
    <!-- Edit Modal content -->
    <section id="edit-modal" class="modal" role="dialog" tabindex="-1" aria-labelledby="edit-modal-title" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="edit-modal-title" class="modal-title fs-5">Edit Expense</h2>
          <button type="button" class="btn-close" aria-label="Close"></button>
        </div>
          <form id="edit-form" class="modal-body">
              <label for="edit-expense-name" class="form-label">Expense name</label>
              <input type="text" id="edit-expense-name" class="form-control" placeholder="Enter an expense name" required>
              <label for="edit-amount-amount" class="form-label">Amount</label>
              <input type="number" id="edit-amount-amount" class="form-control" placeholder="Enter an amount" min="0.01" step="0.01" required>
              <label for="edit-date-date" class="form-label">Date</label>
              <input type="date" id="edit-date-date" class="form-control" required>
              <label for="edit-category-category" class="form-label">Category</label>
              <select id="edit-category-category" class="form-select" required>
                  <option value="">Select a category</option>
                  <option value="food">Food</option>
                  <option value="transportation">Transportation</option>
                  <option value="entertainment">Entertainment</option>
                  <option value="utilities">Utilities</option>
                  <option value="other">Other</option>
              </select>

              <p id="edit-message" class="text-danger" role="status"></p>
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <button type="button" id="delete-expense-btn" class="btn btn-danger">Delete Expense</button>
              <button type="button" class="btn btn-outline-secondary cancel-edit-btn">Cancel</button>
          </form>
      </div>
    </section>
  </main>
</body>
</html>
